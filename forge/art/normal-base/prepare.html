<!doctype html><html><body><script>
window.prepare = async function(family) {
 const image=new Image();image.src='sources/'+family+'.png';await image.decode();
 const source=document.createElement('canvas');source.width=image.width;source.height=image.height;
 const context=source.getContext('2d',{willReadFrequently:true});context.drawImage(image,0,0);
 const pixels=context.getImageData(0,0,source.width,source.height),labels=new Int32Array(source.width*source.height),queue=new Int32Array(labels.length),components=[];
 let component=0;
 for(let start=0;start<labels.length;start++){
  if(labels[start]||pixels.data[start*4+3]<200)continue;
  component++;let head=0,tail=1;queue[0]=start;labels[start]=component;
  let minX=source.width,minY=source.height,maxX=0,maxY=0;
  while(head<tail){const at=queue[head++],x=at%source.width,y=Math.floor(at/source.width);minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=source.width||ny>=source.height)continue;const next=ny*source.width+nx;if(!labels[next]&&pixels.data[next*4+3]>=200){labels[next]=component;queue[tail++]=next;}}
  }
  components.push({id:component,area:tail,minX,minY,maxX,maxY});
 }
 // Locate the actual six separate creatures; generated anatomy can cross nominal grid lines.
 const largest=components.sort((a,b)=>b.area-a.area).slice(0,6).sort((a,b)=>(a.minY+a.maxY)-(b.minY+b.maxY));
 if(largest.length!==6)throw new Error('Expected six complete creatures: '+family);
 const ordered=[...largest.slice(0,3).sort((a,b)=>a.minX-b.minX),...largest.slice(3).sort((a,b)=>a.minX-b.minX)];
 const result=[],shades=[32,112,176,224,248];
 for(let index=0;index<6;index++){
  const item=ordered[index],stage=index%3+1,view=index<3?'front':'back',w=item.maxX-item.minX+1,h=item.maxY-item.minY+1;
  if(item.minX<4||item.minY<4||item.maxX>=source.width-4||item.maxY>=source.height-4)throw new Error('Source creature reaches outer sheet edge: '+family+stage+view);
  const crop=document.createElement('canvas');crop.width=w;crop.height=h;const cropContext=crop.getContext('2d'),clean=cropContext.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const at=(y+item.minY)*source.width+x+item.minX;if(labels[at]!==item.id)continue;const from=at*4,to=(y*w+x)*4;clean.data.set(pixels.data.subarray(from,from+3),to);clean.data[to+3]=255;}
  cropContext.putImageData(clean,0,0);
  const canvas=document.createElement('canvas');canvas.width=96;canvas.height=96;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=false;
  const target=[0,64,76,86][stage],scale=target/Math.max(w,h),dw=Math.round(w*scale),dh=Math.round(h*scale);
  ctx.drawImage(crop,0,0,w,h,Math.floor((96-dw)/2),Math.floor((96-dh)/2),dw,dh);
  const out=ctx.getImageData(0,0,96,96);let opaque=0;
  for(let i=0;i<out.data.length;i+=4){if(!out.data[i+3])continue;const value=Math.round(.2126*out.data[i]+.7152*out.data[i+1]+.0722*out.data[i+2]);const shade=shades.reduce((best,n)=>Math.abs(n-value)<Math.abs(best-value)?n:best,shades[0]);out.data[i]=out.data[i+1]=out.data[i+2]=shade;out.data[i+3]=255;opaque++;}
  ctx.putImageData(out,0,0);
  const {minX,minY,maxX,maxY}=item;
  result.push({family,stage,view,file:family+'-stage'+stage+'-'+view+'.png',width:96,height:96,opaque,sourceBounds:{minX,minY,maxX,maxY},png:canvas.toDataURL('image/png').split(',')[1]});
 }
 return result;
};
</script></body></html>
